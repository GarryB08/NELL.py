services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8501"
    volumes:
      - ./data:/app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot:/etc/letsencrypt:ro
